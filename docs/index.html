<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor cen - Media Expert</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 1000px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: #fafafa;
    color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121212; color: #eee; }
    .card { background: #1e1e1e !important; }
    select { background: #222; color: #eee; border-color: #444; }
  }
  h1 { font-size: 1.4rem; }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 1.2rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  select { padding: .4rem; border-radius: 6px; margin-bottom: 1rem; }
  .stat { display: inline-block; margin-right: 2rem; }
  .stat b { display: block; font-size: 1.3rem; }
  .updated { color: #888; font-size: .85rem; }
</style>
</head>
<body>

<h1>📉 Monitor cen produktów</h1>
<p class="updated" id="lastUpdate">Wczytywanie danych...</p>

<div class="card">
  <label for="productSelect">Produkt:</label>
  <select id="productSelect"></select>
  <div id="stats"></div>
  <canvas id="priceChart" height="100"></canvas>
</div>

<script>
const BRANCH = 'main';

// Kandydaci na lokalizacje CSV, sprawdzani po kolei:
// 1. ../data/prices.csv - dziala lokalnie i gdy Pages serwuje katalog glowny repo,
// 2. raw.githubusercontent.com - dziala, gdy Pages serwuje tylko /docs
//    (wtedy data/ nie jest publikowane). Login i repo wyciagane z adresu strony.
function csvCandidates() {
  const urls = ['../data/prices.csv'];
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const repo = location.pathname.split('/').filter(Boolean)[0];
  if (m && repo) {
    urls.push(`https://raw.githubusercontent.com/${m[1]}/${repo}/${BRANCH}/data/prices.csv`);
  }
  return urls;
}

async function fetchCSVText() {
  for (const url of csvCandidates()) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (res.ok) return await res.text();
    } catch (e) { /* probujemy nastepnego kandydata */ }
  }
  throw new Error('Nie znaleziono pliku data/prices.csv');
}

// Parser CSV zgodny z RFC 4180 (pola w cudzyslowach, przecinki i "" w srodku) -
// tytuly produktow z Media Expert zawieraja przecinki.
function parseCSV(text) {
  const records = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') records.push(row);
      row = [];
    } else field += c;
  }
  row.push(field);
  if (row.length > 1 || row[0] !== '') records.push(row);
  return records;
}

async function loadCSV() {
  const [headers, ...records] = parseCSV(await fetchCSVText());
  if (!headers) return [];
  return records.map(cells => {
    const row = {};
    headers.forEach((h, i) => row[h] = cells[i] ?? '');
    return row;
  });
}

function groupByProduct(rows) {
  const grouped = {};
  for (const row of rows) {
    const key = row.part_no || row.title || row.url;
    if (!grouped[key]) grouped[key] = { title: row.title, rows: [] };
    grouped[key].rows.push(row);
  }
  return grouped;
}

let chart;

function renderChart(rows, title) {
  const labels = rows.map(r => r.timestamp);
  const price = rows.map(r => parseFloat(r.price));
  const salePrice = rows.map(r => r.sale_price ? parseFloat(r.sale_price) : null);

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('priceChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Cena regularna', data: price, borderColor: '#888', tension: 0.1 },
        { label: 'Cena promocyjna', data: salePrice, borderColor: '#e63946', tension: 0.1 },
      ]
    },
    options: {
      responsive: true,
      plugins: { title: { display: true, text: title } },
      scales: {
        // bez sztywnego unit - Chart.js sam dobierze godziny/dni/miesiace do zakresu danych
        x: { type: 'time', time: { tooltipFormat: 'dd.MM.yyyy HH:mm' } },
        y: { title: { display: true, text: 'zł' } }
      }
    }
  });

  const last = rows[rows.length - 1];
  const min = Math.min(...price.filter(p => !isNaN(p)));
  document.getElementById('stats').innerHTML = `
    <div class="stat">Aktualna cena<b>${last.price} zł</b></div>
    <div class="stat">Promo<b>${last.sale_price || '-'} zł</b></div>
    <div class="stat">Najniższa odnotowana<b>${min} zł</b></div>
  `;
}

(async function init() {
  const status = document.getElementById('lastUpdate');
  let rows;
  try {
    rows = await loadCSV();
  } catch (e) {
    status.textContent = 'Błąd wczytywania danych: ' + e.message;
    return;
  }
  if (rows.length === 0) {
    status.textContent = 'Brak danych - scraper jeszcze nic nie zapisał.';
    return;
  }

  const grouped = groupByProduct(rows);
  const select = document.getElementById('productSelect');

  Object.entries(grouped).forEach(([key, group]) => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = group.title || key;
    select.appendChild(opt);
  });

  function showSelected() {
    const key = select.value;
    renderChart(grouped[key].rows, grouped[key].title);
  }

  select.addEventListener('change', showSelected);
  showSelected();

  const lastRow = rows[rows.length - 1];
  status.textContent = 'Ostatnia aktualizacja: ' +
    new Date(lastRow.timestamp).toLocaleString('pl-PL');
})();
</script>

</body>
</html>
